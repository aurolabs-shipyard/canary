# Canary config — copy to canary.yaml and edit.
# v0.1: one repeatable ingestion path (Postgres read replica).
# Read-only access only. No writes. No PII required.

source:
  type: postgres
  # Use a read-only role on a replica. Canary will refuse to run if
  # the role can write (CREATE/INSERT/UPDATE/DELETE rights detected).
  url: ${CANARY_POSTGRES_URL}
  query: |
    SELECT
      account_id,
      account_name,
      last_active_at,
      sessions_last_30d,
      power_users_last_30d,
      seats
    FROM cs_account_health
  # How to map your columns onto Canary's account model.
  account_id_field: account_id
  account_name_field: account_name

owners:
  type: csv
  path: ./owners.csv     # columns: account_id,csm_email,csm_slack_user_id

# Account-level rules. Each rule produces at most one alert per account
# per dedupe_window. Keep the rule set narrow; this is not a health-score builder.
rules:
  - id: usage-cliff
    label: "Usage cliff (>50% drop vs 30d avg)"
    severity: high
    when: "sessions_last_30d < (rolling_avg_sessions_90d * 0.5)"
    require:
      - "rolling_avg_sessions_90d >= 20"   # ignore tiny accounts
    dedupe_window_days: 7

  - id: power-user-loss
    label: "Lost all power users"
    severity: high
    when: "power_users_last_30d == 0 && previous_power_users > 0"
    dedupe_window_days: 14

  - id: stale-account
    label: "No activity in 14 days"
    severity: medium
    when: "days_since_last_active >= 14"
    require:
      - "seats >= 5"
    dedupe_window_days: 14

alerts:
  channel: slack
  webhook_url: ${CANARY_SLACK_WEBHOOK}
  # If unset or set to "dry-run", alerts are stored only — useful for pilots.
  mode: dry-run

pilot:
  # Pilots capture acted/ignored/false-positive feedback per alert
  # via `canary feedback <alert-id> <verdict>`.
  enabled: true
  # Stop sending more alerts to a CSM if they ignore 5 in a row — prevents alert fatigue.
  fatigue_threshold: 5
